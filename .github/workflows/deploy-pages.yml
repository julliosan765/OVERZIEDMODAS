name: Publicar storefront estático no GitHub Pages

on:
  push:
    branches: [main, root]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar pnpm compatível
        run: npm install --global pnpm@10.4.1
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Gerar site estático
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm run build:static --base=/${{ github.event.repository.name }}/
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
